[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# ── 1. Next.js Static Chunks & Bundles (1 Year Immutable) ──
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Netlify-CDN-Cache-Control = "public, max-age=31536000, immutable"

# ── 2. Static Assets (Images, Icons, Fonts, WebP, AVIF) ──
[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Netlify-CDN-Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.(webp|avif|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot)"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Netlify-CDN-Cache-Control = "public, max-age=31536000, immutable"

# ── 3. Next.js Image Optimization Cache ──
[[headers]]
  for = "/_next/image*"
  [headers.values]
    Cache-Control = "public, max-age=86400, s-maxage=604800, stale-while-revalidate=86400"
    Netlify-CDN-Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

# ── 4. Public API GET Endpoints (Edge Cached with Stale-While-Revalidate) ──
[[headers]]
  for = "/api/products*"
  [headers.values]
    Cache-Control = "public, max-age=0, s-maxage=60, stale-while-revalidate=300"
    Netlify-CDN-Cache-Control = "public, max-age=60, stale-while-revalidate=300"

[[headers]]
  for = "/api/stories*"
  [headers.values]
    Cache-Control = "public, max-age=0, s-maxage=60, stale-while-revalidate=300"
    Netlify-CDN-Cache-Control = "public, max-age=60, stale-while-revalidate=300"

[[headers]]
  for = "/api/leaderboard*"
  [headers.values]
    Cache-Control = "public, max-age=0, s-maxage=60, stale-while-revalidate=300"
    Netlify-CDN-Cache-Control = "public, max-age=60, stale-while-revalidate=300"

[[headers]]
  for = "/api/billboards*"
  [headers.values]
    Cache-Control = "public, max-age=0, s-maxage=60, stale-while-revalidate=300"
    Netlify-CDN-Cache-Control = "public, max-age=60, stale-while-revalidate=300"

[[headers]]
  for = "/api/ads*"
  [headers.values]
    Cache-Control = "public, max-age=0, s-maxage=60, stale-while-revalidate=300"
    Netlify-CDN-Cache-Control = "public, max-age=60, stale-while-revalidate=300"

[[headers]]
  for = "/api/faq*"
  [headers.values]
    Cache-Control = "public, max-age=0, s-maxage=300, stale-while-revalidate=86400"
    Netlify-CDN-Cache-Control = "public, max-age=300, stale-while-revalidate=86400"

# ── 5. HTML Pages & Global Security Headers ──
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
